<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>아이노바 실험실</title>
    <link rel="stylesheet" href="index.css" />
    <script src="../shared/constants.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/meeting-state.js"></script>
    <script src="../shared/meeting-bridge.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="index.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="card hero">
        <div class="hero__top">
          <div class="hero__copy">
            <p class="eyebrow">i-Nova</p>
            <h1>아이노바 실험실</h1>
            <p class="subtitle">현재 대화에서 질문 정리와 자주 쓰는 요청을 바로 엽니다.</p>
          </div>
          <div class="hero__actions">
            <span id="sitePill" class="pill">현재 사이트</span>
            <button id="refreshButton" class="refresh" type="button">새로고침</button>
          </div>
        </div>
        <div class="hero__foot">
          <span id="syncStatus" class="sync">읽는 중</span>
        </div>
      </header>

      <section class="card controls" aria-label="확장 설정">
        <div class="control">
          <div class="control__copy">
            <span class="control__title">이 사이트에서 사용</span>
            <span class="control__desc">i-Nova 대화 화면에서 우측 패널과 프롬프트 도구를 켭니다.</span>
          </div>
          <button id="enabledToggle" class="switch" type="button" role="switch" aria-checked="true">
            <span class="switch__track"><span class="switch__thumb"></span></span>
            <span id="enabledToggleLabel" class="switch__label">켜짐</span>
          </button>
        </div>

        <div id="pauseControl" class="control" hidden>
          <div class="control__copy">
            <span class="control__title">이 대화만 잠시 끄기</span>
            <span class="control__desc">현재 대화에서만 우측 패널과 자동 수집을 잠시 멈춥니다.</span>
          </div>
          <button id="pauseToggle" class="switch" type="button" role="switch" aria-checked="false">
            <span class="switch__track"><span class="switch__thumb"></span></span>
            <span id="pauseToggleLabel" class="switch__label">꺼짐</span>
          </button>
        </div>
      </section>

      <section class="card meeting" aria-label="회의 상태">
        <div class="meeting__header">
          <div class="meeting__copy">
            <p class="meeting__eyebrow">Meeting</p>
            <h2 id="meetingTitle" class="meeting__title">회의 페이지 바로가기</h2>
          </div>
          <span id="meetingBadge" class="meeting__badge" data-status="idle">대기</span>
        </div>
        <p id="meetingSummary" class="meeting__summary">녹음과 전사, 결과 상세는 전용 회의 페이지에서 처리합니다.</p>
        <p id="meetingHint" class="meeting__hint">팝업은 현재 대화의 최신 상태를 요약해서 보여주고, 회의 페이지로만 연결합니다.</p>
        <div class="meeting__actions">
          <button id="meetingOpenButton" class="meeting__button meeting__button--primary" type="button">회의 페이지 열기</button>
        </div>
      </section>

      <section class="card notes">
        <div class="notes__row">
          <span class="notes__title">현재 사이트</span>
          <span id="tabLabel" class="notes__value">확인 중</span>
        </div>
        <div class="notes__row">
          <span class="notes__title">현재 대화</span>
          <span id="sessionLabel" class="notes__value">대화 화면을 열어 주세요</span>
        </div>
      </section>
    </main>
  </body>
</html>
