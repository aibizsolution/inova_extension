<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>아이노바 작업실 설정</title>
    <link rel="stylesheet" href="index.css" />
    <script src="../shared/constants.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="index.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="card setting" aria-label="회의 작업실 연결 설정">
        <p class="eyebrow">i-Nova</p>
        <h1>회의 작업실 연결</h1>
        <p class="subtitle">팝업에서는 작업실이 상용 호스팅을 볼지, 로컬 호스팅을 볼지만 고릅니다.</p>
        <div class="segment-control" role="group" aria-label="회의 작업실 호스팅 대상">
          <button id="workspaceTargetProductionButton" class="segment-control__button" type="button">상용 호스팅</button>
          <button id="workspaceTargetLocalButton" class="segment-control__button" type="button">로컬 호스팅</button>
        </div>
        <p id="workspaceTargetHint" class="hint">상용 호스팅을 사용합니다.</p>
      </section>
    </main>
  </body>
</html>
