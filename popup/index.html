<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>i-Nova 더하기</title>
    <link rel="stylesheet" href="index.css" />
    <script src="../shared/constants.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="index.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="card hero">
        <div class="hero__top">
          <div class="hero__copy">
            <p class="eyebrow">i-Nova 확장</p>
            <h1>질문 모아보기</h1>
            <p class="subtitle">현재 대화의 질문 모으기와 패널 표시를 제어합니다.</p>
          </div>
          <div class="hero__actions">
            <span id="sitePill" class="pill">현재 사이트</span>
            <button id="refreshButton" class="refresh" type="button">새로 읽기</button>
          </div>
        </div>
        <div class="hero__foot">
          <span id="sessionLabel" class="session-chip">대화 확인 중</span>
          <span id="syncStatus" class="sync">읽는 중</span>
        </div>
      </header>

      <section class="card controls" aria-label="확장 설정">
        <div class="control">
          <div class="control__copy">
            <span class="control__title">i-Nova에서 사용</span>
            <span class="control__desc">이 사이트에서 질문 모아보기와 찾기 기능을 켭니다.</span>
          </div>
          <button id="enabledToggle" class="switch" type="button" role="switch" aria-checked="true">
            <span class="switch__track"><span class="switch__thumb"></span></span>
            <span id="enabledToggleLabel" class="switch__label">켜짐</span>
          </button>
        </div>

        <div class="control">
          <div class="control__copy">
            <span class="control__title">질문 자동 모으기</span>
            <span class="control__desc">이 대화에 보이는 질문을 자동으로 모아 보여줍니다.</span>
          </div>
          <button id="autoBookmarkToggle" class="switch" type="button" role="switch" aria-checked="true">
            <span class="switch__track"><span class="switch__thumb"></span></span>
            <span id="autoBookmarkToggleLabel" class="switch__label">켜짐</span>
          </button>
        </div>

        <div class="control">
          <div class="control__copy">
            <span class="control__title">이 대화에서 일시 중지</span>
            <span class="control__desc">질문 자동 모으기와 패널 표시를 잠시 멈춥니다.</span>
          </div>
          <button id="pauseToggle" class="switch" type="button" role="switch" aria-checked="false">
            <span class="switch__track"><span class="switch__thumb"></span></span>
            <span id="pauseToggleLabel" class="switch__label">꺼짐</span>
          </button>
        </div>
      </section>

      <section class="card notes">
        <div class="notes__row">
          <span class="notes__title">현재 사이트</span>
          <span id="tabLabel" class="notes__value">확인 중</span>
        </div>
        <div class="notes__row">
          <span class="notes__title">패널 위치</span>
          <span class="notes__value">닫힌 상태에서 드래그</span>
        </div>
      </section>
    </main>
  </body>
</html>
