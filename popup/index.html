<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>아이노바 작업실 설정</title>
    <link rel="stylesheet" href="index.css" />
    <script src="../shared/constants.js"></script>
    <script src="../shared/firestore-collections.js"></script>
    <script src="../shared/product-lane.js"></script>
    <script src="../shared/firebase-config.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/provider-identity-cache.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="index.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="card setting" aria-label="호스팅 연결 설정">
        <section class="setting-row" aria-label="회의 작업실 호스팅 대상">
          <p class="setting-row__title">호스팅</p>
          <div class="segment-control" role="group" aria-label="회의 작업실 호스팅 대상">
            <button id="workspaceTargetProductionButton" class="segment-control__button" type="button">상용</button>
            <button id="workspaceTargetLocalButton" class="segment-control__button" type="button">로컬</button>
          </div>
        </section>
        <section class="setting-row" aria-label="디버그 콘솔 설정">
          <p class="setting-row__title">디버그</p>
          <div class="segment-control segment-control--compact" role="group" aria-label="디버그 콘솔 표시 여부">
            <button id="debugConsoleOffButton" class="segment-control__button" type="button">OFF</button>
            <button id="debugConsoleOnButton" class="segment-control__button" type="button">ON</button>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
