name: Repo Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Root Dependencies
        run: npm ci --ignore-scripts

      - name: Verify Contracts And Docs
        run: npm run verify

      - name: Verify Feature Doc Guard On PR Range
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          node scripts/verify-feature-doc-update.js --range "origin/${{ github.base_ref }}..HEAD"

      - name: Verify Release Guard On PR Range
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          node scripts/verify-release-metadata.js --range "origin/${{ github.base_ref }}..HEAD"

      - name: Verify Feature Doc Guard On Push Range
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/verify-feature-doc-update.js --range "${{ github.event.before }}..HEAD"

      - name: Verify Release Guard On Push Range
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/verify-release-metadata.js --range "${{ github.event.before }}..HEAD"

      - name: Detect Release Metadata Changes On PR
        if: github.event_name == 'pull_request'
        id: detect_release_changes_pr
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}..HEAD" | grep -E '^(package\.json|manifest\.json|releases/release-notes\.json)$' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Release Metadata Changes On Push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        id: detect_release_changes_push
        run: |
          if git diff --name-only --diff-filter=ACMR "${{ github.event.before }}..HEAD" | grep -E '^(package\.json|manifest\.json|releases/release-notes\.json)$' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release Metadata
        if: |
          (github.event_name == 'pull_request' && steps.detect_release_changes_pr.outputs.changed == 'true') ||
          (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && steps.detect_release_changes_push.outputs.changed == 'true')
        run: npm run release:build
