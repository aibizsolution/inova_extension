<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>i-Nova Fixture Session</title>
  </head>
  <body>
    <main class="chat-history__content">
      <h1>신규 프로모션 회의</h1>

      <section aria-label="채팅 기록">
        <div aria-label="채팅 메시지 목록" role="log">
          <article>
            <div>이번 분기 런칭 일정 다시 정리해 주세요.</div>
          </article>

          <article>
            <div aria-label="Google: Gemini 3 Pro"></div>
            <div>런칭 일정은 기획 확정, 제작, 검수, 배포 순서로 정리하면 됩니다.</div>
          </article>

          <article>
            <div>오프라인 행사 예산은 얼마까지 가능한가요?</div>
          </article>

          <article>
            <div aria-label="Anthropic: Claude Opus 4"></div>
            <div>현재 예산 초안을 기준으로 장소, 장비, 운영 인력을 나눠 확인해야 합니다.</div>
          </article>

          <article>
            <div>다음 주까지 필요한 액션 아이템만 추려 주세요.</div>
          </article>

          <article>
            <div aria-label="Google: Gemini 3 Pro"></div>
            <div>다음 주까지는 일정 확정, 예산 승인, 담당자 지정 세 가지만 우선 처리하세요.</div>
          </article>
        </div>
      </section>

      <section class="chat-composer">
        <textarea class="chat-input__textarea" placeholder="무엇이든 입력하고 대화하세요"></textarea>
      </section>
    </main>
  </body>
</html>
