<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>i-Nova Fixture Session</title>
  </head>
  <body>
    <main class="chat-history__content">
      <h1>신규 프로모션 회의</h1>

      <section aria-label="채팅 기록">
        <article class="chat-message chat-message--assistant">
          <div class="chat-message__text">안녕하세요. 오늘 안건을 정리해 볼게요.</div>
        </article>

        <article class="chat-message chat-message--user">
          <div class="chat-message__text">이번 분기 런칭 일정 다시 정리해 주세요.</div>
        </article>

        <article class="chat-message chat-message--user">
          <div class="chat-message__text">오프라인 행사 예산은 얼마까지 가능한가요?</div>
        </article>

        <article class="chat-message chat-message--assistant">
          <div class="chat-message__text">현재 예산 초안을 먼저 확인해 보겠습니다.</div>
        </article>

        <article class="chat-message chat-message--user">
          <div class="chat-message__text">다음 주까지 필요한 액션 아이템만 추려 주세요.</div>
        </article>
      </section>

      <section class="chat-composer">
        <textarea class="chat-input__textarea" placeholder="무엇이든 입력하고 대화하세요"></textarea>
      </section>
    </main>
  </body>
</html>
