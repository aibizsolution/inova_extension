<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inova Prompt Panel Bridge</title>
    <script>
      (function suppressFirestoreDeprecationWarnings() {
        const originalWarn = typeof window.console?.warn === "function"
          ? window.console.warn
          : null;
        if (!originalWarn) {
          return;
        }
        window.console.warn = function patchedFirestoreWarn(...args) {
          const text = args
            .map((value) => typeof value === "string" ? value : value?.message || "")
            .join(" ");
          if (
            text.includes("enableMultiTabIndexedDbPersistence()")
            || text.includes("enableIndexedDbPersistence()")
            || text.includes("FirestoreSettings.cache")
          ) {
            return;
          }
          return originalWarn.apply(this, args);
        };
      })();
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script>
      (function loadPromptPanelBridgeScript() {
        const script = document.createElement("script");
        script.defer = true;
        script.src = `prompt-panel-bridge.js${window.location.search || ""}`;
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body></body>
</html>
