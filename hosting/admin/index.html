<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>아이노바 실험실</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <script>
      (() => {
        const assetVersion = `admin=${Date.now().toString(36)}`;
        document.write(`<link rel="stylesheet" href="/shared/design-system.css?${assetVersion}" />`);
        document.write(`<link rel="stylesheet" href="index.css?${assetVersion}" />`);
        document.write(`<script src="/shared/design-system.js?${assetVersion}" defer><\/script>`);
        document.write(`<script src="index.js?${assetVersion}" defer><\/script>`);
      })();
    </script>
  </head>
  <body>
    <div id="adminToastSlot" class="inova-toast-slot" data-inova-toast-slot hidden></div>
    <main id="adminShell" class="admin-shell" data-view="loading">
      <aside id="adminSidebar" class="admin-sidebar" hidden>
        <div class="admin-brand">
          <p class="admin-eyebrow">Admin Console</p>
          <h1>아이노바 실험실</h1>
        </div>

        <nav class="admin-nav" aria-label="관리자 메뉴">
          <div id="navGroups" class="admin-nav__groups"></div>
        </nav>
      </aside>

      <section class="admin-main" aria-label="관리자 본문">
        <section id="sessionPanel" class="admin-context-strip" aria-label="관리자 세션" hidden>
          <div>
            <span>사용자</span>
            <strong id="viewerName">-</strong>
          </div>
          <div>
            <span>계정</span>
            <strong id="viewerEmail">-</strong>
          </div>
          <div>
            <span>권한</span>
            <strong id="viewerRole">-</strong>
          </div>
          <div>
            <span>세션</span>
            <strong id="sessionExpiresAt">-</strong>
          </div>
        </section>

        <header class="admin-topbar">
          <div class="admin-topbar__title">
            <p id="sectionEyebrow" class="admin-eyebrow">Loading</p>
            <h2 id="sectionTitle">관리자 권한 확인</h2>
            <p id="statusSummary" class="admin-summary">관리자 권한을 확인하고 있습니다.</p>
          </div>
        </header>

        <section id="contentPanel" class="admin-content" hidden>
          <div class="admin-page-layout">
            <section id="pageOutlet" class="admin-page-outlet" aria-label="선택된 관리자 메뉴"></section>
          </div>
        </section>

        <section id="loadingPanel" class="admin-loading inova-status-state">
          <div id="loadingIcon" class="inova-status-state__icon" aria-hidden="true"></div>
          <p class="inova-status-state__eyebrow">Loading</p>
          <h2 id="loadingTitle" class="inova-status-state__title">관리자 권한 확인</h2>
          <p id="loadingMessage" class="inova-status-state__body">관리자 권한을 확인하고 있습니다.</p>
          <p class="inova-status-state__hint">확장 패널에서 전달된 세션을 확인하는 중입니다.</p>
        </section>

        <section id="blockedPanel" class="admin-blocked inova-status-state" data-tone="danger" hidden>
          <div id="blockedIcon" class="inova-status-state__icon" aria-hidden="true"></div>
          <p class="inova-status-state__eyebrow">Blocked</p>
          <h2 id="blockedTitle" class="inova-status-state__title">관리자 권한을 확인할 수 없습니다</h2>
          <p id="blockedMessage" class="inova-status-state__body">확장 패널에서 관리자 메뉴를 다시 열어 주세요.</p>
          <p class="inova-status-state__hint">권한 확인은 확장 패널의 관리자 메뉴에서 시작됩니다.</p>
        </section>
      </section>
    </main>
  </body>
</html>
