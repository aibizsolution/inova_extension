<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>i-Nova Hosted Panel</title>
    <script>
      (function injectHostedPanelStyles(doc) {
        const assetSuffix = readAssetSuffix();
        globalThis.__INOVA_HOSTED_PANEL_ASSET_SUFFIX__ = assetSuffix;
        [
          "./index.css",
        ].forEach((path) => {
          const link = doc.createElement("link");
          link.rel = "stylesheet";
          link.href = path + assetSuffix;
          doc.head.appendChild(link);
        });

        function readAssetSuffix() {
          try {
            const url = new URL(globalThis.location.href);
            const params = new URLSearchParams();
            const version = url.searchParams.get("v");
            if (version) {
              params.set("v", version);
            }
            if (isLocalHost(url.hostname)) {
              params.set("localAssetTs", String(Date.now()));
            }
            const query = params.toString();
            return query ? `?${query}` : "";
          } catch {
            return "";
          }
        }

        function isLocalHost(hostname) {
          return hostname === "127.0.0.1" || hostname === "localhost";
        }
      })(document);
    </script>
  </head>
  <body>
    <div id="inova-hosted-panel-root"></div>
    <script>
      (function injectHostedPanelScripts(doc) {
        const assetSuffix = globalThis.__INOVA_HOSTED_PANEL_ASSET_SUFFIX__ || "";
        [
          "./runtime.js",
          "./panel-utils.js",
          "./extension-capability-client.js",
          "./feature-usage-tracker.js",
          "./admin-entry-controller.js",
          "./panel-notice-controller.js",
          "./remote-workflow-host.js",
          "./panel-firestore-session-client.js",
          "./base-firestore-client.js",
          "./prompt-text-model.js",
          "./prompt-library-model.js",
          "./prompt-library-firestore-client.js",
          "./prompt-library-controller.js",
          "./prompt-store-model.js",
          "./conversation-dom-parser.js",
          "./conversation-controller.js",
          "./bookmark-view.js",
          "./meeting-view.js",
          "./meeting-firestore-client.js",
          "./meeting-participation-firestore-client.js",
          "./meeting-usage-firestore-client.js",
          "./meeting-hub-controller.js",
          "./prompt-view.js",
          "./prompt-tool-view.js",
          "./store-view.js",
          "./prompt-review-view.js",
          "./prompt-review-controller.js",
          "./prompt-store-firestore-client.js",
          "./prompt-store-controller.js",
          "./prompt-tool-panel.js",
          "./release-view.js",
          "./release-controller.js",
          "./index.js",
        ].forEach((path) => {
          const script = doc.createElement("script");
          script.src = path + assetSuffix;
          script.async = false;
          doc.body.appendChild(script);
        });
      })(document);
    </script>
  </body>
</html>
