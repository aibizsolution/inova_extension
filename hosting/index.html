<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>i-Nova 더하기 릴리스</title>
    <style>
      body { font-family: "Pretendard", "Noto Sans KR", sans-serif; margin: 0; padding: 32px; background: #f7fafc; color: #10212b; }
      main { max-width: 720px; margin: 0 auto; padding: 24px; border: 1px solid rgba(98, 127, 145, 0.16); border-radius: 20px; background: #fff; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { line-height: 1.6; color: rgba(16, 33, 43, 0.76); }
      code { padding: 2px 6px; border-radius: 8px; background: #eef7f9; color: #0f5f77; }
    </style>
  </head>
  <body>
    <main>
      <h1>i-Nova 더하기 릴리스</h1>
      <p>이 공간은 수동 배포용 ZIP과 릴리스 메타 정보를 제공합니다.</p>
      <p>최신 버전 정보는 <code>/extension-v2/releases/latest.json</code>, 버전 이력은 <code>/extension-v2/releases/history.json</code>에서 확인할 수 있습니다.</p>
      <p>기존 <code>/extension/downloads/latest.zip</code> 경로는 최신 v2 설치 파일로 연결되는 호환 경로입니다.</p>
      <p>이 확장은 i-Nova 상용 기능 적용 전 실험 기능을 빠르게 검증하기 위한 도구이며, 제작/운영은 AI비즈솔루션팀이 담당합니다.</p>
    </main>
  </body>
</html>
